<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>arXiv CS 单篇论文排名</title><style>
:root{--ink:#20262a;--muted:#657078;--line:#dce2e4;--green:#087e75;--bg:#fafbfb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:980px;margin:auto;padding:28px 22px 55px}header{border-bottom:2px solid var(--ink);padding-bottom:18px}h1{margin:4px 0;font-size:28px}.muted{color:var(--muted)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:22px 0;border-bottom:1px solid var(--line)}fieldset{border:0;padding:0;margin:0}legend{font-weight:650;margin-bottom:8px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12px}input,button{font:inherit;border:1px solid #bfc9cd;border-radius:5px;background:#fff;padding:8px;min-height:38px;color:var(--ink)}button{cursor:pointer;font-weight:600}button:hover{border-color:var(--green);background:#edf5f4}.quick{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.quick button{font-size:11px;min-height:30px;padding:4px 7px}.quick button.active{background:var(--green);border-color:var(--green);color:#fff}.search{padding:22px 0 10px}.search input{width:100%;font-size:15px}.candidates{margin-top:8px}.candidate{display:block;width:100%;text-align:left;margin:5px 0;padding:9px 11px}.candidate small{display:block;color:var(--muted);font-weight:400}.result{margin-top:20px}.selected{border:1px solid var(--line);border-radius:8px;background:#fff;padding:16px}.selected h2{font-size:19px;margin:0 0 5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.stat{border-top:2px solid var(--green);padding-top:7px}.stat strong{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}.neighbors{margin-top:18px;overflow:auto}.neighbors table{border-collapse:collapse;width:100%;min-width:560px}.neighbors th,.neighbors td{text-align:left;border-bottom:1px solid var(--line);padding:9px 7px;vertical-align:top}.neighbors th{font-size:12px;color:var(--muted);background:#eef2f2}.neighbors .me{background:#e8f5f3;font-weight:650}.error{color:#ad2932;margin-top:8px}.empty{padding:20px 0;color:var(--muted)}a{color:inherit}footer{margin-top:28px;color:var(--muted);font-size:12px}@media(max-width:700px){main{padding:16px 11px 38px}h1{font-size:23px}.filters{display:block;padding:16px 0}.filters fieldset{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line)}.inputs{gap:6px}.quick button{flex:1;min-width:0}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat strong{font-size:19px}.selected{padding:13px}.neighbors{overflow:visible}.neighbors table{min-width:0}.neighbors thead{display:none}.neighbors table,.neighbors tbody,.neighbors tr,.neighbors td{display:block;width:100%}.neighbors tr{border:1px solid var(--line);border-radius:6px;margin:8px 0;padding:7px}.neighbors td{border:0;padding:3px}.neighbors td:first-child{font-weight:650}.neighbors td:nth-child(2)::before{content:'论文：';color:var(--muted);font-weight:400}.neighbors td:nth-child(3)::before{content:'新增引用：';color:var(--muted);font-weight:400}.neighbors td:nth-child(4)::before{content:'分数：';color:var(--muted);font-weight:400}}
</style></head><body><main><header><div class="muted">Research index / CS</div><h1>arXiv CS 单篇论文排名</h1><div class="muted">选择一篇论文，查看它在指定时间窗口内的排名</div><p><a href="./index.html">← 返回总榜</a></p></header><div id="loading">正在载入论文数据…</div><div id="app" hidden><section class="search"><label>搜索论文标题或 arXiv ID<input id="query" type="search" placeholder="例如：transformer 或 2301.12345"></label><div id="candidates" class="candidates"></div></section><section class="filters"><fieldset><legend>论文发表时间窗（v1）</legend><div class="inputs"><label>起始日期<input type="date" id="paper-start"></label><label>结束日期<input type="date" id="paper-end"></label></div><div class="quick" id="paper-quick"><button data-days="90">最近三个月</button><button data-days="180">最近半年</button><button data-days="365">最近一年</button></div></fieldset><fieldset><legend>被引用时间窗（引用方 v1）</legend><div class="inputs"><label>起始日期<input type="date" id="citation-start"></label><label>结束日期<input type="date" id="citation-end"></label></div><div class="quick" id="citation-quick"><button data-days="7">最近 7 天</button><button data-days="30">最近 30 天</button><button data-days="90">最近 90 天</button><button data-days="180">最近半年</button></div></fieldset></section><div id="error" class="error"></div><section id="result" class="result"></section></div><footer>数据与总榜相同：arXiv OAI-PMH · Semantic Scholar Graph API</footer></main><script src="./paper.js?v=1"></script></body></html>
